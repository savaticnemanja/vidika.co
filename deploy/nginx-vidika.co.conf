# vidika.co — host nginx, terminating TLS and proxying to the container on
# 127.0.0.1:8087. It serves no files: the site lives inside the image, so a
# deploy is one `docker compose up` and there is no directory on the host that
# can drift out of step with it. This replaces the previous `root
# /var/www/vidika.co` static vhost.
#
# Installed by deploy/install-root.sh, which also places the two files this
# depends on:
#   conf.d/vidika-ratelimit.conf   the limit_req_zone (http{} context)
#   snippets/cloudflare-realip.conf  real client IP behind Cloudflare
#
# The port-80 blocks below are kept exactly as Certbot left them. The cert at
# /etc/letsencrypt/live/vidika.co/ is shared with welcometomimoland.com, so
# renewal touches both — not the place to tidy.

server {
    server_name vidika.co;

    # Must come before anything that reads $remote_addr: it rewrites the
    # variable the limit_req key and the access log are built from.
    include /etc/nginx/snippets/cloudflare-realip.conf;

    # add_header replaces the inherited set rather than adding to it, so the
    # four from conf.d/security-headers.conf are repeated here alongside the
    # additions. Declared once at server level; no location below adds a
    # header of its own, so every response inherits this whole block.
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    # Only the framing rule. A full CSP would need hashes for the inline head
    # scripts and the inlined stylesheet (astro.config sets inlineStylesheets:
    # always), and a CSP that breaks the page is worse than none.
    add_header Content-Security-Policy   "frame-ancestors 'none'" always;

    # The handler caps a submission at 32 KB and destroys the connection past
    # it. This refuses the same thing one hop earlier, before Node reads a byte.
    client_max_body_size 64k;

    # gzip is already on globally in nginx.conf with `gzip_proxied any`; only
    # the manifest type is missing from that list.
    gzip_types text/plain text/css application/javascript application/json
               application/manifest+json image/svg+xml application/xml;
    # Fonts are woff2, already compressed; gzipping them just burns CPU.

    # The form. Throttled harder than the rest of the site, and separately, so
    # a burst of page views can never use up the budget that protects mail.
    # burst=5 nodelay lets a genuine double-click through and queues nothing.
    location = /api/contact {
        limit_req zone=vidika_contact burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The handler sets nosniff too. Without this the response carries the
        # header twice — same value, so harmless, but nginx is the one that
        # also covers its own 429s, so let its copy be the only one.
        proxy_hide_header X-Content-Type-Options;
        # A submission is a single small POST; buffering it whole means the
        # Node process is never held open by a slow client.
        proxy_request_buffering on;
    }

    # Liveness, for the uptime-kuma check. Not logged — it would be most of
    # the access log otherwise.
    location = /healthz {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        access_log off;
    }

    # Everything else is the site, served out of the image.
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header X-Content-Type-Options;

        # The handler sets its own Cache-Control per file type — a year and
        # immutable for the fingerprinted assets under /_astro/, revalidate for
        # HTML. Nothing here overrides it, so that policy reaches the browser
        # intact. The styled 404 comes from the handler too, so there is no
        # error_page directive here any more.
        proxy_buffering on;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vidika.co/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vidika.co/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Port 80 for the apex domain. Without this the ACME challenge for vidika.co
# falls through to the default_server in sites-available/default and certbot
# generates a block there instead. The redirect lives in `location /` rather
# than at server level: a server-level `return` runs in the rewrite phase,
# before location matching, and would swallow the challenge request.
server {
    if ($host = vidika.co) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vidika.co;

    location /.well-known/acme-challenge/ {
        root /var/www/vidika.co;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    if ($host = vidika.nemanjas.dev) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name vidika.nemanjas.dev;
    return 404; # managed by Certbot
}
