# vidika.co — host nginx.
#
#   sudo cp deploy/nginx-vidika.co.conf /etc/nginx/sites-available/vidika.co
#   sudo ln -s /etc/nginx/sites-available/vidika.co /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx runs on the host, not in Docker, and does two things: terminate TLS and
# proxy everything to the container on 127.0.0.1:8080. It serves no files —
# the site lives inside the image, so a deploy is one `docker compose up` and
# there is no directory on the host that can drift out of step with it.
#
# ── One line goes elsewhere ───────────────────────────────────────────
# The rate-limit zone has to be declared in the http{} block, which means
# /etc/nginx/nginx.conf rather than this file. Add it there once:
#
#   limit_req_zone $binary_remote_addr zone=vidika_contact:10m rate=10r/m;
#
# Without it nginx will not start, and the error names this file.

server {
    listen 80;
    listen [::]:80;
    server_name vidika.co www.vidika.co;

    # Certbot renews over :80, so this has to stay reachable and unredirected.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://vidika.co$request_uri;
    }
}

# www → apex, so the site has one address. src/site.config.ts sets the
# canonical to the apex and the sitemap is generated from it; serving both
# would compete with that.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.vidika.co;

    ssl_certificate     /etc/letsencrypt/live/vidika.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidika.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://vidika.co$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vidika.co;

    ssl_certificate     /etc/letsencrypt/live/vidika.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vidika.co/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # `always` so they are sent on error responses too, which is where a
    # missing nosniff actually costs something.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options           "DENY" always;
    # Only the framing rule. A full CSP would need hashes for the inline head
    # scripts and the inlined stylesheet (astro.config sets inlineStylesheets:
    # 'always'), and a CSP that breaks the page is worse than none.
    add_header Content-Security-Policy   "frame-ancestors 'none'" always;

    # The handler caps a submission at 32 KB and destroys the connection past
    # it. This refuses the same thing one hop earlier, before Node reads a byte.
    client_max_body_size 64k;

    # The app is on loopback, so compressing here rather than in Node costs
    # nothing and keeps the handler simple. `gzip_proxied any` is required —
    # without it nginx will not compress a proxied response at all.
    gzip              on;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/manifest+json image/svg+xml application/xml;
    # Fonts are woff2, which is already compressed; gzipping them just burns CPU.

    # The form. Throttled harder than the rest of the site, and separately,
    # so a burst of page views can never use up the budget that protects mail.
    # burst=5 nodelay lets a genuine double-click through and queues nothing.
    location = /api/contact {
        limit_req zone=vidika_contact burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A submission is a single small POST; buffering it whole means the
        # Node process is never held open by a slow client.
        proxy_request_buffering on;
    }

    # Everything else is the site, served out of the image.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The handler sets its own Cache-Control per file type — a year and
        # immutable for the fingerprinted assets under /_astro/, revalidate for
        # HTML. Nothing here overrides it, so that policy reaches the browser
        # intact.
        proxy_buffering on;
    }

    # Liveness, for an uptime check that should not pull the whole page.
    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        access_log off;
    }
}
