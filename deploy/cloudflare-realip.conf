# Recover the real client IP behind Cloudflare.
#
# vidika.co is proxied (orange cloud): DNS points at Cloudflare, which opens a
# fresh connection to this box. Without this, $remote_addr is a Cloudflare
# edge IP, which quietly breaks two things — access logs name Cloudflare
# instead of the visitor, and `limit_req zone=vidika_contact` buckets the
# entire internet into ~15 keys, so one busy visitor rate-limits everyone.
#
# Included from inside the vidika.co server block rather than http{}, so no
# other vhost on this box changes behaviour.
#
# Ranges from https://www.cloudflare.com/ips-v4 and /ips-v6, fetched
# 2026-08-18. They change rarely; re-fetch if origin logs start showing
# unexpected addresses.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# CF-Connecting-IP carries a single address and is overwritten by Cloudflare on
# every request, so it cannot be spoofed by the visitor the way a
# self-supplied X-Forwarded-For can.
real_ip_header CF-Connecting-IP;
